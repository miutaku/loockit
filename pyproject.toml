[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loockit"
version = "0.1.0"
description = "Local-first controller for SESAME4 / SESAME Bot1 (SesameOS2 BLE) with a gRPC API, real-time state monitoring, and a Matter bridge."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "miutaku" }]
dependencies = [
    "pysesameos2>=0.0.6",
    "grpcio>=1.60",
    "protobuf>=4.25",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Matter bridge. CircuitMatter is a pure-Python Matter *device* implementation
# (no native SDK build required); isolated here so the core runs without it.
# Real commissioning additionally needs avahi-daemon on the host for mDNS.
matter = ["circuitmatter>=0.4"]
# REST + WebSocket interface.
rest = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
# MQTT / Home Assistant bridge.
mqtt = ["aiomqtt>=2.0"]
# Optional CANDY HOUSE Web API v4 fallback. Disabled by default; core never depends on it.
cloud = ["pysesame3>=0.5"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "grpcio-tools>=1.60",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "aiomqtt>=2.0",
    "httpx>=0.27",
]

[project.scripts]
loockit = "loockit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loockit = ["api/proto/*.proto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
